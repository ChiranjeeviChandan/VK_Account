name: Core

# Runs the Python test suite, the WhatsApp bridge tests and the linter.

on:
  push:
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows and macOS have not been verified yet: their results are shown but do not fail the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
            experimental: true
          - os: macos-latest
            python: "3.12"
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up Node.js (for the bridge end-to-end test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        # Test names and the slowest tests are listed so a failure or a hang on one system is easy to place.
        run: python -m pytest -o addopts="" -v --durations=10
        env:
          FELIX_NO_KEYRING: "1"

  install:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # As above: Windows and macOS are reported but not yet required.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      FELIX_NO_KEYRING: "1"
      FELIX_NO_HOST_COMMANDS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and use Felix (macOS and Linux)
        if: runner.os != 'Windows'
        run: |
          export FELIX_PREFIX="$RUNNER_TEMP/felix-app" FELIX_BIN="$RUNNER_TEMP/felix-bin"
          ./scripts/install.sh
          felix="$RUNNER_TEMP/felix-bin/felix"
          "$felix" --version
          "$felix" --home "$RUNNER_TEMP/felix-home" config set mode offline
          "$felix" --home "$RUNNER_TEMP/felix-home" ask "add task check the installer" | tee added.txt
          grep -q "Added to your list: #1 Check the installer" added.txt
          "$felix" --home "$RUNNER_TEMP/felix-home" ask "what's broken"
          "$felix" --home "$RUNNER_TEMP/felix-home" doctor

      - name: Install and use Felix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FELIX_PREFIX = Join-Path $env:RUNNER_TEMP "felix-app"
          ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $felix = Join-Path $env:FELIX_PREFIX "Scripts\felix.exe"
          $home_dir = Join-Path $env:RUNNER_TEMP "felix-home"
          & $felix --version
          & $felix --home $home_dir config set mode offline
          $added = & $felix --home $home_dir ask "add task check the installer"
          Write-Host $added
          if (-not ("$added" -match "Added to your list: #1 Check the installer")) { exit 1 }
          & $felix --home $home_dir ask "what's broken"
          & $felix --home $home_dir doctor
          if ($LASTEXITCODE -ne 0) { exit 1 }

  bridge:
    name: WhatsApp bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node --test "felix/whatsapp/sidecar/test/*.test.js"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          python -m pip install "ruff>=0.6"
          python -m ruff check felix tests
