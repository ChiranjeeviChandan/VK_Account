name: Core

# Runs the Python test suite, the WhatsApp bridge tests and the linter.

on:
  push:
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Windows and macOS have not been verified yet: their results are shown but do not fail the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
            experimental: true
          - os: macos-latest
            python: "3.12"
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up Node.js (for the bridge end-to-end test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
        env:
          FELIX_NO_KEYRING: "1"

  bridge:
    name: WhatsApp bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node --test "felix/whatsapp/sidecar/test/*.test.js"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          python -m pip install "ruff>=0.6"
          python -m ruff check felix tests
