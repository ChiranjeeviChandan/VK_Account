<head>

<title>Felix</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif;
         background: Canvas; color: CanvasText; }

  code { padding: .15rem .4rem; border-radius: 4px; background: color-mix(in srgb, CanvasText 10%, transparent); }

<main>
  <h1>Felix is locked in this browser</h1>
  <p>The dashboard opens only with your private link. In a terminal, run:</p>
  <p><code>felix open</code></p>

</main>
